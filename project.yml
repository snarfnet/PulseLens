name: PulseLens
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.PulseLens
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  PulseLens:
    type: application
    platform: iOS
    sources:
      - PulseLens
    settings:
      base:
        INFOPLIST_FILE: PulseLens/Info.plist
        PRODUCT_NAME: PulseLens
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PulseLens/Info.plist
      properties:
        CFBundleName: PulseLens
        CFBundleDisplayName: パルスレンズ
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Uses the rear camera and flash to read your pulse from the light passing through your fingertip. Video is never saved or transmitted."
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
